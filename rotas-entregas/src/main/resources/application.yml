spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rotaentregas
    username:  postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.rotaentregas: DEBUG
    org.springframework.web: INFO